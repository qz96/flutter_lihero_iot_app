name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'baseline-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Flutter dependencies
        run: flutter pub get

      # configs.json 含密钥，已被 gitignore，这里从仓库 Secret 还原
      # 在 GitHub 仓库 Settings → Secrets → Actions 中添加名为 CONFIGS_JSON 的密钥，
      # 内容为本地 configs.json 的原始文本（建议用压缩后的单行 JSON）。
      - name: Restore configs.json from secret
        env:
          CONFIGS_JSON: ${{ secrets.CONFIGS_JSON }}
        run: echo "$CONFIGS_JSON" > configs.json

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define-from-file configs.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 仅当推送 tag（如 v1.0.0 / baseline-v1.0）时，自动创建 Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
