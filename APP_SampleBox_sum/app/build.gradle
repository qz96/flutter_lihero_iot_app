apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.0"
    defaultConfig {
        applicationId "com.lh.lhble"
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 120
        versionName "5.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi", "armeabi-v7a",'arm64-v8a', "x86", "mips"
        }

        signingConfigs {
            release {
                storeFile file('LHBLE.jks')
                storePassword 'lhkjpwd'
                keyAlias 'lhble'
                keyPassword 'lhkjpwd'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.githang:status-bar-compat:0.7'
    api project(path: ':wiseKit')
    // ZXing
    implementation 'com.google.zxing:core:3.3.0'

    // 2017年4月24日16:16:43 retrofit网络框架
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.1.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.1.0'
    implementation 'com.alibaba:fastjson:1.1.70.android'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.3.1'
    implementation 'com.zhy:okhttputils:2.6.2'

    //rxJava rxAndroid
    implementation 'io.reactivex.rxjava2:rxjava:2.0.7'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'

    // 友盟基础组件库（所有友盟业务SDK都依赖基础组件库）
    implementation 'com.umeng.umsdk:common:9.4.7' //（必选）
    implementation 'com.umeng.umsdk:asms:1.4.1' // asms包依赖(必选)
    implementation 'com.umeng.umsdk:apm:1.5.2' // U-APM包依赖(必选)
    implementation  'com.umeng.umsdk:abtest:1.0.0'//使用U-App中ABTest能力，可选
    //时间选择器
    implementation 'com.contrarywind:Android-PickerView:4.1.6'
    implementation 'com.jzxiang.pickerview:TimePickerDialog:1.0.1'
    //安卓生成Excel库
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
}
